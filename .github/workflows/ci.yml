name: CI

on:
  push:
  pull_request:

# Read-only access is all this workflow needs.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        # Same OpenCV swap as in the Dockerfile: use the headless build only.
        run: |
          pip install -e ".[dev]"
          pip uninstall -y opencv-python
          pip install --no-deps --force-reinstall opencv-python-headless

      - name: Lint and test
        run: bash scripts/run_tests.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
